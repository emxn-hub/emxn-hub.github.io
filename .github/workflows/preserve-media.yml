name: Preserve portfolio media
on:
  push:
    paths:
      - '.github/workflows/preserve-media.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy media and rewrite links
        run: python3 scripts/preserve_media.py
      - name: Commit verified assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets '*.html'
          git diff --cached --quiet || git commit -m "Preserve portfolio media locally"
          git push
